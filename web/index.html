<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Reader Upload</title>
    <link rel="stylesheet" href="/web/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Music Reader</p>
          <h1>上传谱面照片、PDF 或 MusicXML</h1>
          <p class="summary">前端只保留识别入口；手工制谱编辑器和样本数据已经移出项目。</p>
        </div>
        <div class="status" id="status">等待上传</div>
      </section>

      <section class="panel">
        <label class="drop-zone" for="score-file">
          <span class="drop-title">选择谱面文件</span>
          <span class="drop-hint">支持图片、PDF、MusicXML、MIDI。照片/PDF 会走 OMR，XML 会直接解析。</span>
          <input id="score-file" type="file" accept=".png,.jpg,.jpeg,.webp,.tif,.tiff,.bmp,.pdf,.xml,.musicxml,.mxl,.mid,.midi">
        </label>

        <div class="controls">
          <button id="recognize-button" type="button">识别并尝试出答案</button>
          <button id="photoscore-button" type="button">PhotoScore XML 出答案</button>
          <button id="context-button" type="button">生成 PhotoScore AI 上下文</button>
        </div>
      </section>

      <section class="results">
        <article>
          <h2>识别/解析结果</h2>
          <pre id="parse-output">{}</pre>
        </article>
        <article>
          <h2>求解答案</h2>
          <pre id="answer-output">{}</pre>
        </article>
      </section>
    </main>
    <script src="/web/app.js"></script>
  </body>
</html>
